# NBI Slurm resources. Paths are supplied by submit_model_pipeline.sh so this
# file remains usable from any shared project or scratch directory.
slurm_cpu_partition: nbi-medium
slurm_gpu_partition: ei-gpu
slurm_download_partition: nbi-download
slurm_gpu_gres: "--gres=gpu:a100:1"

# Each training rule currently trains its label-specific models sequentially
# inside one A100 allocation. These limits are minutes and deliberately leave
# room for queue variation and checkpoint evaluation.
ner_training_runtime: 4320
rel_training_runtime: 5760
