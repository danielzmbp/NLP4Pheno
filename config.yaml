  - STRAIN-COMPOUND:PRODUCES
  - STRAIN-DISEASE:INHIBITS
model_sets:
    - train
    - dev
    - test
ner_epochs: 15
rel_epochs: 25
input_file: label/project-10-reviewed-2026-09-02-network-disagreement-pass.json
# Generated by scripts/link_annotations_to_pmc.py from the exact PMC corpus
# used for training/prediction. Only unique PMCIDs become split groups.
annotation_pmc_matches_file: label/annotation_pmc_matches_2026-09-02.parquet
# Preserve the 2026-07-27 dev/test tasks for fair comparison with the previous
# model. Newly annotated tasks are training-only unless their PMCID belongs to
# a frozen evaluation group, in which case they are excluded to prevent leakage.
frozen_split_manifest: label/frozen_splits_gold4061_4a6ea98.json
cutoff_prediction: 0.50
core_min_pmcs: 2
core_min_relation_score: 0.90
core_min_entity_score: 0.90
core_min_strain_score: 0.95
# cuda_devices: [1,2,3]
cuda_devices: [0]
ner_test: 0.2
rel_test: 0.3
dataset: 2509
model: "large"
seed: 2509
output_path: /pfs/work9/workspace/scratch/tu_kmpaj01-link
pmc_parquet_file: snakemake_PMC/output/data/pmc_filtered.parquet
straininfo_version: "2025.10"
straininfo_strains_file: resources/straininfo/strains.parquet
straininfo_designations_file: resources/straininfo/designations_union.parquet
straininfo_assembly_workers: 8
straininfo_max_failure_fraction: 0.01
ontology_aliases_file: resources/ontologies/runtime/aliases.parquet
ontology_manifest_file: resources/ontologies/runtime/manifest.json
