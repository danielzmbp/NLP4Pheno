name: pytorch
channels:
  - conda-forge
  - bioconda
dependencies:
  # Python version (using 3.12 for compatibility)
  - python=3.12
  - pip
  
  # Install everything else via pip to match the torch environment
  - pip:
    # PyTorch with CUDA
    - torch==2.8.0
    - triton==3.4.0
    
    # Core HuggingFace packages
    - transformers==4.55.0
    - datasets==4.0.0
    - tokenizers==0.21.4
    - accelerate==1.10.0
    - safetensors==0.6.2
    - huggingface-hub==0.34.4
    - evaluate==0.4.5
    
    # ML/Data Science packages
    - numpy==2.3.2
    - pandas==2.3.1
    - scikit-learn==1.7.1
    - scipy==1.16.1
    
    # Data handling
    - pyarrow==21.0.0
    - dill==0.3.8
    - xxhash==3.5.0
    
    # Networking
    - aiohttp==3.12.15
    - requests==2.32.4
    - urllib3==2.5.0
    
    # Utilities
    - tqdm==4.67.1
    - filelock==3.13.1
    - packaging==25.0
    - typing-extensions==4.12.2
    - regex==2025.7.34
    - pyyaml==6.0.2
    - fsspec==2024.6.1
    - psutil==7.0.0
    
    # Date/Time
    - python-dateutil==2.9.0.post0
    - pytz==2025.2
    - tzdata==2025.2
    
    # Math
    - sympy==1.13.3
    - mpmath==1.3.0
    - networkx==3.3
    
    # Threading
    - multiprocess==0.70.16
    - threadpoolctl==3.6.0
    - joblib==1.5.1
    
    # Web/Template
    - jinja2==3.1.4
    - markupsafe==3.0.2
    
    # Async
    - aiosignal==1.4.0
    - frozenlist==1.7.0
    - multidict==6.6.3
    - yarl==1.20.1
    - attrs==25.3.0
    - aiohappyeyeballs==2.6.1
    - propcache==0.3.2
    
    # Certificates and IDs
    - certifi==2025.8.3
    - charset-normalizer==3.4.2
    - idna==3.10
    - six==1.17.0
    
    # Evaluation
    - seqeval==1.2.2
    
    # Optional HF extension
    - hf-xet==1.1.7
